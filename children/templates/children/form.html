{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}子供プロフィールを編集する{% else %}子供プロフィールを登録する{% endif %} | PapaCook{% endblock %}

{% block content %}
    <h1>{% if form.instance.pk %}子供プロフィールを編集する{% else %}子供プロフィールを登録する{% endif %}</h1>
    <form method="post" class="child-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if form.instance.pk %}更新する{% else %}登録する{% endif %}</button>
    </form>

    <p><a href="{% url 'children:list' %}">一覧に戻る</a></p>
{% endblock %}
