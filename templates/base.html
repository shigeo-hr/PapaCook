<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PapaCook{% endblock %}</title>
</head>
<body>
    <header>
        <span>PapaCook</span>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit">ログアウト</button>
            </form>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        {% block footer %}
            <small>&copy; PapaCook</small>
        {% endblock %}
    </footer>
</body>
</html>
