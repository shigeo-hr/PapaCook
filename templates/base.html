<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PapaCook{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <style>
        :root {
            --bs-primary: #fd7e14;
            --bs-primary-rgb: 253, 126, 20;
            --bs-primary-text-emphasis: #7a3d0a;
            --bs-primary-bg-subtle: #ffe5cc;
            --bs-primary-border-subtle: #ffc999;
            --bs-link-color: #d9600a;
            --bs-link-color-rgb: 217, 96, 10;
            --bs-link-hover-color: #b34f08;
            --bs-link-hover-color-rgb: 179, 79, 8;
            --bs-body-font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
        }

        .btn-primary {
            --bs-btn-bg: var(--bs-primary);
            --bs-btn-border-color: var(--bs-primary);
            --bs-btn-hover-bg: #e46c00;
            --bs-btn-hover-border-color: #e46c00;
            --bs-btn-active-bg: #cc6100;
            --bs-btn-active-border-color: #cc6100;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <span class="navbar-brand mb-0 h1">PapaCook</span>
                {% if user.is_authenticated %}
                    <form method="post" action="{% url 'accounts:logout' %}" class="d-flex mb-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">ログアウト</button>
                    </form>
                {% endif %}
            </div>
        </nav>
    </header>
    <main class="container py-4">
        {% if messages %}
            <ul class="messages list-unstyled mb-4">
                {% for message in messages %}
                    <li class="message alert alert-{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-light text-center text-muted py-3">
        {% block footer %}
            <small>&copy; PapaCook</small>
        {% endblock %}
    </footer>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>
</body>
</html>
